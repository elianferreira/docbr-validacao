apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docbr-validacao
  namespace: producao
  labels:
    network: internal
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - docbr-validacao.univali.br
      secretName: wildcard-univali-tls
  rules:
    - host: docbr-validacao.univali.br
      http:
        paths:
          # Quando houver backend .NET, descomentar e apontar pro Service dele:
          # - path: /api
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: docbr-validacao-backend
          #       port:
          #         number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docbr-validacao
                port:
                  number: 80
