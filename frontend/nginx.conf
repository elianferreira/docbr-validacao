# nginx do front: serve o estático do `expo export` e nada mais.
#
# Rodando como UID 10001 (ver Dockerfile): sem a diretiva `user` (só vale como root e
# emitiria warning a cada start) e com pid em /tmp, que o usuário do app pode escrever.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;

  # Não vazar versão (fingerprint) — pareia com BACKEND_STACK.md §03.
  server_tokens off;

  # Caches temporários dentro de /tmp: o resto do FS é read-only para o UID do app.
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # `always` para valerem também em resposta de erro.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP: cada afrouxamento entra com a origem MEDIDA no bundle exportado, nunca por
    # precaução (DEPLOY_STACK.md §01.1). O que já está medido:
    #   style-src 'unsafe-inline' -> <style id="expo-reset"> do export + o StyleSheet
    #     do react-native-web, que monta regras num <style> em runtime;
    #   img-src data: -> imagem/ícone embutido como data URL.
    # `script-src 'self'` puro: o index.html exportado não tem script inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Healthcheck local. No k8s a probe bate em "/" (anônimo), não aqui.
    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }

    # O `expo export` tem DOIS prefixos com hash no nome, não um como o Vite.
    location /_expo/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # SPA obrigatória com `web.output: "single"`: existe um único index.html e o
    # expo-router resolve a rota no cliente. Sem este fallback, abrir /inicio direto
    # (ou recarregar) devolveria 404 do nginx.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
